# TEMP (#1468): this branch trims CI to isolate the blank-webview reproduction.
# Only the webview-dependent suites run (see the test:it:with-prebuilt-vsix glob),
# each matrix job is a single attempt (no retry) so every job is one clean sample,
# and CODE_VERSION is A/B'd between `max` (VS Code >= 1.123.0, Chromium 148) and
# 1.122.0 (Chromium 142, known good). Not for merge.
on:
  workflow_call:
    inputs:
      vsix-artifact-name:
        description: Name of the VSIX artifact to download
        required: true
        type: string
      runner-ubuntu:
        description: Ubuntu runner label
        required: false
        type: string
        default: ubuntu-latest
      runner-macos:
        description: macOS runner label
        required: false
        type: string
        default: macos-latest
      runner-windows:
        description: Windows runner label
        required: false
        type: string
        default: windows-latest
      run-ubuntu:
        description: Whether to run Ubuntu integration tests
        required: false
        type: boolean
        default: true
      run-macos:
        description: Whether to run macOS integration tests
        required: false
        type: boolean
        default: true
      run-windows:
        description: Whether to run Windows integration tests
        required: false
        type: boolean
        default: true
      enable-qemu:
        description: Whether to set up QEMU for Ubuntu Minikube
        required: false
        type: boolean
        default: true
      install-yarn:
        description: Whether to install Yarn globally (for self-hosted runners)
        required: false
        type: boolean
        default: false
      retry-wait-ubuntu:
        description: Retry wait seconds for Ubuntu
        required: false
        type: number
        default: 30
      retry-wait-macos:
        description: Retry wait seconds for macOS
        required: false
        type: number
        default: 60
      retry-wait-windows:
        description: Retry wait seconds for Windows
        required: false
        type: number
        default: 30

name: Integration Tests

jobs:
  test-ubuntu:
    if: ${{ inputs.run-ubuntu }}
    runs-on: ${{ inputs.runner-ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        code-version: [max, "1.122.0"]
        sample: [1, 2, 3]
    name: ubuntu / ${{ matrix.code-version }} / sample ${{ matrix.sample }}

    env:
      CODE_VERSION: ${{ matrix.code-version }}
      TEST_RESOURCES: test-resources

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          cache: yarn
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.vsix-artifact-name }}
      - name: Install test dependencies
        run: yarn install --mode=skip-build
      - name: Allow unprivileged user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run Integration Tests (single attempt)
        run: xvfb-run -a yarn run test:it:with-prebuilt-vsix
      - uses: ./.github/actions/upload-test-artifacts
        if: failure()
        with:
          os-name: ubuntu-${{ matrix.code-version }}-${{ matrix.sample }}

  test-windows:
    if: ${{ inputs.run-windows }}
    runs-on: ${{ inputs.runner-windows }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        code-version: [max, "1.122.0"]
    name: windows / ${{ matrix.code-version }}

    env:
      CODE_VERSION: ${{ matrix.code-version }}
      TEST_RESOURCES: test-resources

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          cache: yarn
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.vsix-artifact-name }}
      - name: Install test dependencies
        run: yarn install --mode=skip-build
      - name: Run Integration Tests (single attempt)
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          yarn run test:it:with-prebuilt-vsix
      - uses: ./.github/actions/upload-test-artifacts
        if: failure()
        with:
          os-name: windows-${{ matrix.code-version }}
