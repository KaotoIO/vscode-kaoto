on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Build with released version of Kaoto

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          cache: yarn
      - name: yarn install
        run: yarn --network-timeout 1000000
      - name: yarn build:prod
        run: yarn build:prod
      # TEMP (#1468): unit tests and SBOM skipped on this diagnostic branch —
      # only the VSIX is needed to feed the integration-test A/B.
      - name: vsix package
        run: yarn build:vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-kaoto-vsix
          path: "*.vsix"

  integration-tests:
    needs: build
    uses: ./.github/workflows/_integration-tests.yaml
    with:
      vsix-artifact-name: vscode-kaoto-vsix
